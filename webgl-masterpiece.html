<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FractalGenerator — WebGL Masterpiece</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; height:100%; background:#02030a; font-family: Inter, system-ui, sans-serif; }
    canvas { width:100%; height:100%; display:block; }
    .hud {
      position: fixed; top: 16px; left: 16px; z-index: 2;
      background: rgba(3, 8, 24, .65); border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0,0,0,.35); font-size: 13px;
    }
    .hud b { color: #9be9ff; }
  </style>
</head>
<body>
  <div class="hud"><b>WebGL Mandelbrot</b><br/>Drag: pan · Wheel: zoom · Space: auto-pilot</div>
  <canvas id="gl"></canvas>
  <script>
    const canvas = document.getElementById('gl');
    const gl = canvas.getContext('webgl');
    if (!gl) throw new Error('WebGL unavailable');

    const vs = `attribute vec2 aPos; void main(){ gl_Position = vec4(aPos,0.0,1.0);} `;
    const fs = `
      precision highp float;
      uniform vec2 uRes; uniform float uTime; uniform vec2 uCenter; uniform float uZoom;
      vec3 palette(float t){
        return 0.5 + 0.5*cos(6.28318*(vec3(0.08,0.27,0.53)*t + vec3(0.0,0.15,0.32)));
      }
      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
        float zoom = exp(uZoom);
        vec2 c = uCenter + uv / zoom;
        vec2 z = vec2(0.0);
        float m2 = 0.0;
        float it = 0.0;
        const float maxIt = 420.0;
        for(float i=0.0;i<420.0;i++){
          z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + c;
          m2 = dot(z,z);
          if(m2 > 256.0){ it = i; break; }
          it = maxIt;
        }
        float smooth = it - log2(max(1.0, log2(m2))) + 4.0;
        float t = smooth/maxIt;
        vec3 col = (it>=maxIt) ? vec3(0.0) : palette(t + 0.03*sin(uTime*0.6));
        col *= 1.0 - 0.25*length(uv);
        gl_FragColor = vec4(pow(col, vec3(0.9)), 1.0);
      }
    `;
    function shader(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
    const p=gl.createProgram(); gl.attachShader(p, shader(gl.VERTEX_SHADER,vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw gl.getProgramInfoLog(p); gl.useProgram(p);

    const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const aPos=gl.getAttribLocation(p,'aPos'); gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);

    const uRes=gl.getUniformLocation(p,'uRes'), uTime=gl.getUniformLocation(p,'uTime'), uCenter=gl.getUniformLocation(p,'uCenter'), uZoom=gl.getUniformLocation(p,'uZoom');
    let center=[-0.743643887037151, 0.13182590420533], zoom=7.0, dragging=false, last=[0,0], auto=true;

    function resize(){ const dpr=Math.min(devicePixelRatio||1,2); canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr; gl.viewport(0,0,canvas.width,canvas.height);} addEventListener('resize',resize); resize();
    canvas.addEventListener('mousedown',e=>{dragging=true;auto=false;last=[e.clientX,e.clientY];});
    addEventListener('mouseup',()=>dragging=false);
    addEventListener('mousemove',e=>{ if(!dragging) return; const dx=e.clientX-last[0], dy=e.clientY-last[1]; last=[e.clientX,e.clientY]; const s=Math.exp(-zoom); center[0]-=dx/canvas.height*s; center[1]+=dy/canvas.height*s;});
    canvas.addEventListener('wheel',e=>{ e.preventDefault(); auto=false; zoom += -Math.sign(e.deltaY)*0.12; }, {passive:false});
    addEventListener('keydown',e=>{ if(e.code==='Space') auto=!auto; });

    const start=performance.now();
    (function frame(now){
      const t=(now-start)/1000;
      if(auto){ zoom += 0.0035; center[0] += 0.00003*cos(t*0.27); center[1] += 0.00003*sin(t*0.31); }
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, t);
      gl.uniform2f(uCenter, center[0], center[1]);
      gl.uniform1f(uZoom, zoom);
      gl.drawArrays(gl.TRIANGLES,0,3);
      requestAnimationFrame(frame);
    })(start);
  </script>
</body>
</html>
