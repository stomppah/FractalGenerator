<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FractalGenerator — WebGL Masterpiece</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; font-family: Inter, Segoe UI, system-ui, sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; }
    .hud {
      position: fixed; top: 12px; left: 12px; z-index: 2;
      background: rgba(5, 9, 20, 0.58); backdrop-filter: blur(8px);
      border: 1px solid rgba(132, 204, 255, 0.25);
      border-radius: 12px; padding: 10px 12px; color: #d7f4ff;
      box-shadow: 0 6px 24px rgba(14, 42, 70, 0.45);
      font-size: 13px; line-height: 1.45;
    }
    .hud b { color: #7ad6ff; }
    .hud .sub { opacity: .8; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <div><b>FractalGenerator: WebGL Masterpiece</b></div>
    <div class="sub">Scroll: zoom • Drag: pan • Double-click: recenter</div>
    <div id="stats" class="sub"></div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl2', { antialias: true });
  if (!gl) {
    document.body.innerHTML = '<pre style="padding:2rem;color:#fff">WebGL2 is required.</pre>';
    return;
  }

  const vert = `#version 300 es
  precision highp float;
  out vec2 uv;
  void main() {
    vec2 pos = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
    uv = pos;
    gl_Position = vec4(pos * 2.0 - 1.0, 0.0, 1.0);
  }`;

  const frag = `#version 300 es
  precision highp float;
  out vec4 outColor;
  in vec2 uv;

  uniform vec2 uResolution;
  uniform vec2 uCenter;
  uniform float uScale;
  uniform float uTime;
  uniform int uMaxIter;

  vec3 palette(float t) {
    vec3 a = vec3(0.5, 0.5, 0.5);
    vec3 b = vec3(0.5, 0.5, 0.5);
    vec3 c = vec3(1.0, 0.9, 0.8);
    vec3 d = vec3(0.00, 0.15 + 0.05*sin(uTime*0.2), 0.2 + 0.05*cos(uTime*0.15));
    return a + b * cos(6.28318 * (c * t + d));
  }

  void main() {
    vec2 p = (uv - 0.5) * vec2(uResolution.x / uResolution.y, 1.0) * uScale + uCenter;

    vec2 z = vec2(0.0);
    float iter = 0.0;
    float trap = 1e10;

    for (int i = 0; i < 5000; i++) {
      if (i >= uMaxIter) break;
      z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + p;
      trap = min(trap, dot(z, z));
      if (dot(z, z) > 256.0) {
        iter = float(i) + 1.0 - log2(log2(dot(z,z))) + 4.0;
        break;
      }
      iter += 1.0;
    }

    if (iter >= float(uMaxIter)) {
      float innerGlow = exp(-3.0 * sqrt(trap));
      outColor = vec4(vec3(innerGlow * 0.18, innerGlow * 0.32, innerGlow * 0.5), 1.0);
    } else {
      float t = iter / float(uMaxIter);
      vec3 col = palette(t);
      float fog = exp(-2.0 * t);
      col += vec3(0.02, 0.05, 0.1) * fog;
      col = pow(col, vec3(0.95));
      outColor = vec4(col, 1.0);
    }
  }`;

  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  };

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vert));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));

  const uResolution = gl.getUniformLocation(program, 'uResolution');
  const uCenter = gl.getUniformLocation(program, 'uCenter');
  const uScale = gl.getUniformLocation(program, 'uScale');
  const uTime = gl.getUniformLocation(program, 'uTime');
  const uMaxIter = gl.getUniformLocation(program, 'uMaxIter');

  const state = { centerX: -0.74364388703, centerY: 0.13182590421, scale: 1.8, maxIter: 680 };
  const stats = document.getElementById('stats');

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', resize);
  resize();

  let dragging = false;
  let lastX = 0, lastY = 0;

  canvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup', () => dragging = false);
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = (e.clientX - lastX) / innerHeight;
    const dy = (e.clientY - lastY) / innerHeight;
    state.centerX -= dx * state.scale;
    state.centerY += dy * state.scale;
    lastX = e.clientX; lastY = e.clientY;
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoom = Math.exp(Math.sign(e.deltaY) * 0.075);
    state.scale *= zoom;
    state.maxIter = Math.max(220, Math.min(2400, Math.floor(340 + 130 * Math.log2(2.0 / state.scale + 1.0))));
  }, { passive: false });

  canvas.addEventListener('dblclick', (e) => {
    const nx = (e.clientX / innerWidth - 0.5) * (innerWidth / innerHeight);
    const ny = (0.5 - e.clientY / innerHeight);
    state.centerX += nx * state.scale;
    state.centerY += ny * state.scale;
  });

  const start = performance.now();
  function frame() {
    const t = (performance.now() - start) * 0.001;
    gl.useProgram(program);
    gl.uniform2f(uResolution, canvas.width, canvas.height);
    gl.uniform2f(uCenter, state.centerX, state.centerY);
    gl.uniform1f(uScale, state.scale);
    gl.uniform1f(uTime, t);
    gl.uniform1i(uMaxIter, state.maxIter);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    stats.textContent = `center (${state.centerX.toFixed(10)}, ${state.centerY.toFixed(10)}) • zoom ${(2/state.scale).toFixed(2)}x • iter ${state.maxIter}`;
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
