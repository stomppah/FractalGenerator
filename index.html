<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fractal Generator — WebGL Masterpiece</title>
  <link rel="stylesheet" href="webgl/style.css" />
</head>
<body>
  <canvas id="glCanvas"></canvas>
  <aside class="hud">
    <h1>Fractal Generator</h1>
    <p>WebGL Mandelbrot + Julia explorer</p>
    <label>Iterations <input id="iterations" type="range" min="64" max="2000" value="800" /></label>
    <label>Color Shift <input id="shift" type="range" min="0" max="6.283" step="0.001" value="0" /></label>
    <label>Zoom Speed <input id="zoomSpeed" type="range" min="0.02" max="0.4" step="0.01" value="0.12" /></label>
    <label><input id="juliaToggle" type="checkbox" /> Julia mode</label>
    <div class="tips">Drag to pan • Scroll to zoom • Double-click to set Julia seed</div>
  </aside>
  <script type="module" src="webgl/main.js"></script>
</body>
</html>
